[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aapda-setu-backend"
version = "0.1.0"
description = "Aapda Setu - Disaster Management Decision Support Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.112.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.8.0",
    "pydantic-settings==2.3.0",
    "pydantic-extra-types==2.6.0",
    "httpx==0.27.0",
    "email-validator==2.1.0",
    "python-dotenv==1.0.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "black==24.4.0",
    "ruff==0.4.0",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "PIE", "PT", "PTH", "ERA", "PD", "PL", "TRY", "NPY", "RUF", "ARG", "RET", "ASYNC"
]
ignore = ["S101", "S311", "S603", "S607", "B008", "B009", "PLR0913", "PLR0915", "TRY003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]