version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aapda-setu-postgres
    environment:
      POSTGRES_USER: aapda
      POSTGRES_PASSWORD: aapda_dev_password
      POSTGRES_DB: aapda_setu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/seeds/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aapda -d aapda_setu"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aapda-setu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: